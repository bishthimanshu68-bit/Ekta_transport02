<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekta Transport Company Portal</title>
    <!-- Tailwind CSS CDN for modern styling inside dynamic modules -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .left-section {
            flex: 1.2;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            padding: 0;
            overflow-y: auto;
        }
        .top-navbar {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            padding: 18px 0;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .nav-links {
            display: flex;
            justify-content: space-evenly;
            list-style: none;
            margin: 0;
            padding: 0 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .nav-links li a {
            color: #cbd5e1;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.3s;
            white-space: nowrap;
        }
        .nav-links li a:hover, .nav-links li a.active {
            color: #ff6600;
        }
        .banner-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }
        .brand-box .transport-title {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .brand-box .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            color: #94a3b8;
        }
        .right-section {
            flex: 0.8;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-left: 1px solid #334155;
        }
        .login-card {
            background: #0f172a;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .login-tabs {
            display: flex;
            margin-bottom: 25px;
            background: #1e293b;
            border-radius: 6px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #ff6600;
            color: #ffffff;
        }
        .login-title {
            font-family: 'Oswald', sans-serif;
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-group input:focus {
            border-color: #ff6600;
            outline: none;
        }
        .forgot-pass {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-pass a {
            color: #94a3b8;
            font-size: 12px;
            text-decoration: none;
        }
        .forgot-pass a:hover {
            color: #ff6600;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #ff6600;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #e65c00;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .register-link a {
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Left Section (Banner, Navigation & Dynamic Content) -->
        <div class="left-section">
            
            <!-- Navigation Bar Stretched -->
            <nav class="top-navbar">
                <ul class="nav-links">
                    <li><a href="#" class="active" onclick="showTab('home', event)">Home</a></li>
                    <li><a href="#" onclick="showTab('about', event)">About Us</a></li>
                    <li><a href="#" onclick="showTab('services', event)">Services</a></li>
                    <li><a href="#" onclick="showTab('gallery', event)">Photo Gallery</a></li>
                    <li><a href="#" onclick="showTab('career', event)">Career</a></li>
                    <li><a href="#" onclick="showTab('contact', event)">Contact Us</a></li>
                </ul>
            </nav>

            <!-- Dynamic Content Display Area -->
            <div class="banner-content" id="content-display">
                <div class="brand-box">
                    <h1 class="transport-title">Ekta Transport Company</h1>
                    <p class="tagline">Delivering Trust, On Time. Moving India Forward.</p>
                </div>
            </div>

        </div>

        <!-- Right Section (Login Portal) -->
        <div class="right-section">
            <div class="login-card">
                <div class="login-tabs">
                    <button class="tab-btn active" id="ownerTabBtn" onclick="switchLogin('owner')">Owner</button>
                    <button class="tab-btn" id="staffTabBtn" onclick="switchLogin('staff')">Staff</button>
                </div>

                <h2 class="login-title" id="loginPortalTitle">Owner Login Portal</h2>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label id="userIdLabel">Owner User ID / Mobile</label>
                        <input type="text" id="userId" placeholder="Enter ID or Mobile" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="forgot-pass">
                        <a href="#" onclick="openForgotModal(event)">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Secure Login</button>
                </form>

                <div class="register-link" id="registerLinkSection">
                    Don't have an account? <a href="#" onclick="openRegisterModal(event)">Register Now</a>
                </div>
            </div>
        </div>

    </div>

    <!-- Lightbox Modal for Big Photo View -->
    <div id="lightboxModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column;">
        <span onclick="closeLightbox()" style="position: absolute; top: 20px; right: 30px; font-size: 35px; color: white; cursor: pointer; font-weight: bold;">&times;</span>
        <img id="lightboxImg" src="" style="max-width: 85%; max-height: 80vh; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.5);">
        <p id="lightboxCaption" style="color: #cbd5e1; margin-top: 15px; font-size: 16px; font-weight: 500;"></p>
    </div>

    <!-- Modals (Register & Forgot) -->
    <div id="registerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 25px; border-radius: 8px; width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: left; position: relative;">
            <h3 style="margin-top: 0; margin-bottom: 20px; color: #ff6600;">Owner Registration</h3>
            
            <div id="stepMobile">
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">Owner Name</label>
                    <input type="text" id="regOwnerName" placeholder="Enter full name" style="width: 100%; padding: 9px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">Mobile Number</label>
                    <input type="text" id="regMobile" placeholder="Enter 10-digit mobile number" style="width: 100%; padding: 9px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <button type="button" onclick="sendOtpToOwner()" style="width: 100%; padding: 10px; background: #ff6600; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send OTP</button>
            </div>

            <div id="stepOtp" style="display: none;">
                <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">Enter 4-Digit OTP</label>
                <input type="text" id="enteredOtp" placeholder="Enter OTP received on SMS" style="width: 100%; padding: 9px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                <button type="button" onclick="verifyOtp()" style="width: 100%; padding: 10px; background: #ff6600; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Verify OTP</button>
            </div>

            <div id="stepPassword" style="display: none;">
                <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" style="width: 100%; padding: 9px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                
                <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" style="width: 100%; padding: 9px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                
                <button type="button" onclick="saveOwnerPassword()" style="width: 100%; padding: 10px; background: #ff6600; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Password & Register</button>
            </div>

            <button type="button" onclick="closeRegisterModal()" style="position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: #888;">✕</button>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 25px; border-radius: 8px; width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: left; position: relative;">
            <h3 style="margin-top: 0; margin-bottom: 20px; color: #ff6600;">Forgot Password</h3>
            
            <div id="forgotStep1">
                <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">Registered Mobile Number</label>
                <input type="text" id="forgotMobile" placeholder="Enter 10-digit mobile number" style="width: 100%; padding: 9px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                <button type="button" onclick="sendForgotOtp()" style="width: 100%; padding: 10px; background: #ff6600; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send OTP</button>
            </div>

            <div id="forgotStep2" style="display: none;">
                <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">Enter New Password</label>
                <input type="password" id="newForgotPass" placeholder="Enter new password" style="width: 100%; padding: 9px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                <button type="button" onclick="resetPasswordFinal()" style="width: 100%; padding: 10px; background: #ff6600; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Reset Password</button>
            </div>

            <button type="button" onclick="closeForgotModal()" style="position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: #888;">✕</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="db.js"></script>
    <script src="auth.js"></script>
    <script>
        const FAST2SMS_API_KEY = "ec0PmqH9a3fVg7URyOX6G36L8RqvRR4zsRzn2viob2JwsHLu5VUqiqUeMdne";

        function showTab(tabName, event) {
            if(event) event.preventDefault();
            
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');

            const displayArea = document.getElementById('content-display');

            if (tabName === 'home') {
                displayArea.innerHTML = `
                    <div class="brand-box">
                        <h1 class="transport-title">Ekta Transport Company</h1>
                        <p class="tagline">Delivering Trust, On Time. Moving India Forward.</p>
                    </div>`;
            } else if (tabName === 'about') {
                displayArea.innerHTML = `
                    <div style="text-align: left; max-width: 650px; padding: 10px;">
                        <h2 style="font-family: 'Oswald', sans-serif; font-size: 36px; color: #ff6600; margin-bottom: 15px;">About Ekta Transport Company</h2>
                        <p style="font-size: 15px; line-height: 1.6; color: #cbd5e1; margin-bottom: 12px;">Ekta Transport Company provides robust, secure, and pan-India logistics and freight forwarding solutions. We bridge distances with unmatched efficiency and transparent digital tracking.</p>
                        <p style="font-size: 15px; line-height: 1.6; color: #cbd5e1;">Our dedicated platform empowers fleet owners and staff to manage transport operations seamlessly in real-time.</p>
                    </div>`;
            } else if (tabName === 'services') {
                displayArea.innerHTML = `
                    <div style="text-align: left; max-width: 650px; padding: 10px;">
                        <h2 style="font-family: 'Oswald', sans-serif; font-size: 36px; color: #ff6600; margin-bottom: 15px;">Our Services</h2>
                        <ul style="font-size: 15px; line-height: 1.8; color: #cbd5e1; padding-left: 20px;">
                            <li>Heavy Cargo Fleet Management & Operations</li>
                            <li>Pan-India Express Logistics & Freight Delivery</li>
                            <li>Real-Time GPS Tracking & Consignment Monitoring</li>
                            <li>Secure Owner & Staff Portal Integration</li>
                        </ul>
                    </div>`;
            } else if (tabName === 'gallery') {
                const galleryPhotos = [
                    { url: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80', title: 'Heavy Fleet Truck 1' },
                    { url: 'https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=600&q=80', title: 'Transport Carrier Operations' },
                    { url: 'https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=600&q=80', title: 'Central Warehouse Hub' },
                    { url: 'https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?auto=format&fit=crop&w=600&q=80', title: 'Long Haul Logistics' },
                    { url: 'https://images.unsplash.com/photo-1542296332-2e4473faf563?auto=format&fit=crop&w=600&q=80', title: 'Express Freight Truck' },
                    { url: 'https://images.unsplash.com/photo-1580674684081-7617fbf3d745?auto=format&fit=crop&w=600&q=80', title: 'Fleet Maintenance Bay' }
                ];

                let photosHtml = '';
                galleryPhotos.forEach(photo => {
                    photosHtml += `
                        <div onclick="openLightbox('${photo.url}', '${photo.title}')" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 6px 15px rgba(0,0,0,0.4)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                            <img src="${photo.url}" alt="${photo.title}" style="width: 100%; height: 110px; object-fit: cover; display: block;">
                            <div style="padding: 8px; text-align: center; color: #e2e8f0; font-size: 13px; font-weight: 500;">${photo.title}</div>
                        </div>`;
                });

                displayArea.innerHTML = `
                    <div style="text-align: left; width: 100%; max-width: 720px; padding: 10px; max-height: 80vh; overflow-y: auto;">
                        <h2 style="font-family: 'Oswald', sans-serif; font-size: 32px; color: #ff6600; margin-bottom: 10px;">Photo Gallery</h2>
                        <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 15px;">Click on any image to view it in full screen:</p>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%;">
                            ${photosHtml}
                        </div>
                    </div>`;
            } else if (tabName === 'career') {
                displayArea.innerHTML = `
                    <div style="text-align: left; max-width: 650px; padding: 10px;">
                        <h2 style="font-family: 'Oswald', sans-serif; font-size: 36px; color: #ff6600; margin-bottom: 15px;">Career Opportunities</h2>
                        <p style="font-size: 15px; line-height: 1.6; color: #cbd5e1; margin-bottom: 12px;">Grow your career in the transport and logistics industry with Ekta Transport Company. We welcome skilled professionals, transport managers, and technology experts.</p>
                        <p style="font-size: 15px; color: #ff6600; font-weight: bold;">Drop your inquiries through official management channels.</p>
                    </div>`;
            } else if (tabName === 'contact') {
                displayArea.innerHTML = `
                    <div style="text-align: left; max-width: 650px; padding: 10px;">
                        <h2 style="font-family: 'Oswald', sans-serif; font-size: 36px; color: #ff6600; margin-bottom: 15px;">Contact Us</h2>
                        <p style="font-size: 15px; line-height: 1.6; color: #cbd5e1; margin-bottom: 15px;">Get in touch with the Ekta Transport Company official support desk for business inquiries, fleet attachments, and portal assistance.</p>
                        <p style="font-size: 15px; color: #cbd5e1; font-style: italic;">Official support channels are active for verified owners and registered staff members.</p>
                    </div>`;
            }
        }

        function openLightbox(imgUrl, captionText) {
            document.getElementById('lightboxImg').src = imgUrl;
            document.getElementById('lightboxCaption').innerText = captionText;
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        function switchLogin(type) {
            const ownerBtn = document.getElementById('ownerTabBtn');
            const staffBtn = document.getElementById('staffTabBtn');
            const portalTitle = document.getElementById('loginPortalTitle');
            const userIdLabel = document.getElementById('userIdLabel');
            const registerLinkSec = document.getElementById('registerLinkSection');

            if (type === 'owner') {
                ownerBtn.classList.add('active');
                staffBtn.classList.remove('active');
                portalTitle.innerText = "Owner Login Portal";
                userIdLabel.innerText = "Owner User ID / Mobile";
                registerLinkSec.style.display = 'block';
            } else {
                staffBtn.classList.add('active');
                ownerBtn.classList.remove('active');
                portalTitle.innerText = "Staff Login Portal";
                userIdLabel.innerText = "Staff Employee ID";
                registerLinkSec.style.display = 'none';
            }
        }

        function openRegisterModal(event) {
            if(event) event.preventDefault();
            document.getElementById('registerModal').style.display = 'flex';
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
        }

        function openForgotModal(event) {
            if(event) event.preventDefault();
            document.getElementById('forgotModal').style.display = 'flex';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        let generatedOtp = '';
        let savedMobile = '', savedOwnerName = '';

        // Real Fast2SMS Integration Function
        async function sendFast2SmsOtp(mobile, otp) {
            try {
                const url = `https://www.fast2sms.com/dev/bulkV2?authorization=${FAST2SMS_API_KEY}&route=q&message=Your%20Ekta%20Transport%20OTP%20is%20${otp}&language=english&flash=0&numbers=${mobile}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.return) {
                    console.log('SMS sent successfully via Fast2SMS');
                } else {
                    console.warn('Fast2SMS returned error, falling back to alert');
                    alert(`[Fallback] OTP: ${otp}`);
                }
            } catch (err) {
                console.error('Network error while triggering Fast2SMS:', err);
                alert(`[Offline Mode] OTP: ${otp}`);
            }
        }

        async function sendOtpToOwner() {
            const ownerName = document.getElementById('regOwnerName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            if(!ownerName || mobile.length !== 10) { alert('Please enter valid name and 10-digit mobile number!'); return; }
            
            savedOwnerName = ownerName;
            savedMobile = mobile;
            generatedOtp = Math.floor(1000 + Math.random() * 9000);
            
            await sendFast2SmsOtp(mobile, generatedOtp);
            alert(`OTP has been sent to your mobile number: ${mobile}`);
            
            document.getElementById('stepMobile').style.display = 'none';
            document.getElementById('stepOtp').style.display = 'block';
        }

        function verifyOtp() {
            const userOtp = document.getElementById('enteredOtp').value.trim();
            if(userOtp === generatedOtp.toString()) {
                alert('OTP Verified Successfully!');
                document.getElementById('stepOtp').style.display = 'none';
                document.getElementById('stepPassword').style.display = 'block';
            } else {
                alert('Invalid OTP!');
            }
        }

        async function saveOwnerPassword() {
            const pass1 = document.getElementById('newPassword').value;
            const pass2 = document.getElementById('confirmPassword').value;
            if(pass1.length < 6 || pass1 !== pass2) { alert('Passwords must match and be at least 6 characters!'); return; }

            const ownerData = { name: savedOwnerName, mobile: savedMobile, password: pass1 };
            
            if(typeof postData === 'function') {
                const result = await postData('/register-owner.php', ownerData);
                alert('Owner Registered Successfully on Cloud!');
            } else {
                alert('Owner Registered Successfully (Local Test)!');
            }
            closeRegisterModal();
        }

        async function sendForgotOtp() {
            const mobile = document.getElementById('forgotMobile').value.trim();
            if(mobile.length !== 10) { alert('Enter valid 10-digit mobile number!'); return; }
            
            const forgotOtp = Math.floor(1000 + Math.random() * 9000);
            await sendFast2SmsOtp(mobile, forgotOtp);
            alert('Password reset OTP sent to mobile!');
            
            document.getElementById('forgotStep1').style.display = 'none';
            document.getElementById('forgotStep2').style.display = 'block';
        }

        function resetPasswordFinal() {
            alert('Password Reset Successfully!');
            closeForgotModal();
        }

        // Connected Login with auth.js & Direct Redirection to owner-dashboard.html
        async function handleLogin(event) {
            event.preventDefault();
            const userId = document.getElementById('userId').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            // Determine role based on active tab
            const activeRole = document.getElementById('ownerTabBtn').classList.contains('active') ? 'owner' : 'staff';

            // Call auth.js validation function safely
            if (window.EktaAuth && typeof window.EktaAuth.validateAndLoginUser === 'function') {
                const isAuthenticated = window.EktaAuth.validateAndLoginUser(userId, pass, activeRole);
                if (!isAuthenticated) return;
            }

            const targetPage = (activeRole === 'owner') ? 'owner-dashboard.html' : 'employees.html';

            alert('Login successful! Redirecting to Dashboard...');
