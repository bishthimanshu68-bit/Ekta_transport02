<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ekta Transport Company Portal</title>

    <!-- Tailwind CSS CDN for modern styling inside dynamic modules -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           PHASE 1 — CLEAN PROFESSIONAL UI
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        :root {
            --navy-950: #07111f;
            --navy-900: #0b1728;
            --navy-850: #0f1d31;
            --navy-800: #13243a;

            --slate-500: #94a3b8;
            --slate-300: #cbd5e1;

            --white: #ffffff;

            --orange: #f97316;
            --orange-dark: #ea580c;

            --border: rgba(148, 163, 184, 0.18);
            --soft-border: rgba(255, 255, 255, 0.08);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background: var(--navy-950);
            color: var(--white);

            font-family:
                'Montserrat',
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           MAIN LAYOUT
           ========================================================= */

        .main-container {
            display: flex;

            width: 100%;
            height: 100vh;
            min-height: 620px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 18% 25%,
                    rgba(249, 115, 22, 0.06),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    var(--navy-950),
                    var(--navy-900)
                );
        }

        /* =========================================================
           LEFT SECTION
           ========================================================= */

        .left-section {
            flex: 1.2;

            min-width: 0;

            display: flex;
            flex-direction: column;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 55%,
                    rgba(249, 115, 22, 0.05),
                    transparent 34%
                ),
                linear-gradient(
                    160deg,
                    #081321 0%,
                    #0d1b2e 55%,
                    #10233a 100%
                );
        }

        /* =========================================================
           TOP NAVIGATION
           ========================================================= */

        .top-navbar {
            width: 100%;

            flex-shrink: 0;

            padding: 0 28px;

            border-bottom: 1px solid var(--soft-border);

            background: rgba(7, 17, 31, 0.82);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.10);

            z-index: 20;
        }

        .nav-links {
            width: 100%;

            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 4px;

            list-style: none;

            margin: 0;
            padding: 0;
        }

        .nav-links li {
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 0 14px;

            border-radius: 9px;

            color: var(--slate-300);

            text-decoration: none;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.01em;

            white-space: nowrap;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        /*
           IMPORTANT:
           No text-shadow here.
           This keeps navigation text crisp.
        */

        .nav-links li a::after {
            content: "";

            position: absolute;

            left: 14px;
            right: 14px;

            bottom: 5px;

            height: 2px;

            border-radius: 999px;

            background: var(--orange);

            transform: scaleX(0);

            transition:
                transform 0.2s ease;
        }

        .nav-links li a:hover {
            color: var(--white);

            background:
                rgba(255, 255, 255, 0.045);
        }

        .nav-links li a:hover::after,
        .nav-links li a.active::after {
            transform: scaleX(1);
        }

        .nav-links li a.active {
            color: var(--white);

            background:
                rgba(249, 115, 22, 0.08);
        }

        /* =========================================================
           CENTER / BRAND AREA
           ========================================================= */

        .banner-content {
            flex: 1;

            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 52px;

            text-align: center;

            overflow: auto;
        }

        .brand-box {
            position: relative;

            width: min(760px, 100%);

            padding: 48px 42px;

            border:
                1px solid rgba(255, 255, 255, 0.065);

            border-radius: 24px;

            background:
                rgba(255, 255, 255, 0.022);

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.10);
        }

        .brand-box::before {
            content: "";

            display: block;

            width: 54px;
            height: 4px;

            margin:
                0 auto 24px;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    var(--orange-dark),
                    var(--orange)
                );

            /*
               Very subtle shadow only.
               No blur on text.
            */
            box-shadow:
                0 0 12px rgba(249, 115, 22, 0.14);
        }

        .brand-box .transport-title {
            margin: 0 0 14px;

            font-family: 'Oswald', sans-serif;

            font-size:
                clamp(40px, 5vw, 62px);

            line-height: 1.05;

            color: var(--white);

            letter-spacing: 0.01em;

            /*
               Removed strong text-shadow.
               White title stays razor sharp.
            */
            text-shadow: none;
        }

        .brand-box .tagline {
            margin: 0;

            color: var(--slate-500);

            font-size: 14px;

            line-height: 1.8;

            letter-spacing: 0.02em;
        }

        /* =========================================================
           RIGHT LOGIN SECTION
           ========================================================= */

        .right-section {
            flex: 0.8;

            min-width: 390px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 44px;

            background:
                linear-gradient(
                    145deg,
                    #12243a 0%,
                    #0d1b2e 100%
                );

            border-left:
                1px solid var(--soft-border);

            position: relative;
        }

        .right-section::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            background:
                rgba(249, 115, 22, 0.035);

            filter: blur(2px);

            top: 8%;
            right: -100px;

            pointer-events: none;
        }

        /* =========================================================
           LOGIN CARD
           ========================================================= */

        .login-card {
            position: relative;

            width: min(100%, 410px);

            padding: 32px;

            border-radius: 22px;

            background:
                rgba(7, 17, 31, 0.94);

            border:
                1px solid var(--border);

            box-shadow:
                0 24px 55px rgba(0, 0, 0, 0.24);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            z-index: 1;
        }

        /* =========================================================
           LOGIN TABS
           ========================================================= */

        .login-tabs {
            display: flex;

            gap: 4px;

            margin-bottom: 28px;

            padding: 4px;

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid rgba(255, 255, 255, 0.045);
        }

        .tab-btn {
            flex: 1;

            min-height: 44px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: var(--slate-500);

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--white);

            background:
                rgba(255, 255, 255, 0.045);
        }

        /*
           IMPORTANT:
           No text-shadow.
           No excessive glow.
           Text remains sharp.
        */

        .tab-btn.active {
            color: var(--white);

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            box-shadow:
                0 5px 14px rgba(249, 115, 22, 0.12);
        }

        /* =========================================================
           LOGIN TITLE
           ========================================================= */

        .login-title {
            margin: 0 0 24px;

            font-family: 'Oswald', sans-serif;

            font-size: 28px;

            line-height: 1.15;

            color: var(--white);

            text-align: center;

            letter-spacing: 0.02em;

            text-shadow: none;
        }

        /* =========================================================
           INPUTS
           ========================================================= */

        .input-group {
            margin-bottom: 17px;

            text-align: left;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: var(--slate-300);

            font-size: 12px;

            font-weight: 700;
        }

        .input-group input {
            width: 100%;

            min-height: 48px;

            padding: 0 14px;

            border:
                1px solid rgba(148, 163, 184, 0.20);

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.055);

            color: var(--white);

            font-size: 13px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group input:focus {
            outline: none;

            border-color:
                rgba(249, 115, 22, 0.75);

            background:
                rgba(255, 255, 255, 0.065);

            box-shadow:
                0 0 0 3px rgba(249, 115, 22, 0.09);
        }

        /* =========================================================
           FORGOT PASSWORD
           ========================================================= */

        .forgot-pass {
            margin:
                -2px 0 20px;

            text-align: right;
        }

        .forgot-pass a {
            color: var(--slate-500);

            font-size: 11px;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .forgot-pass a:hover {
            color: var(--orange);
        }

        /* =========================================================
           LOGIN BUTTON
           ========================================================= */

        .login-btn {
            width: 100%;

            min-height: 48px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            color: var(--white);

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 0.02em;

            cursor: pointer;

            /*
               Reduced shadow.
               Keeps button premium without blurry appearance.
            */
            box-shadow:
                0 7px 18px rgba(249, 115, 22, 0.13);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);

            filter: brightness(1.03);

            box-shadow:
                0 10px 22px rgba(249, 115, 22, 0.17);
        }

        /* =========================================================
           REGISTER LINK
           ========================================================= */

        .register-link {
            margin-top: 20px;

            color: var(--slate-500);

            font-size: 11px;

            line-height: 1.6;

            text-align: center;
        }

        .register-link a {
            color: var(--orange);

            text-decoration: none;

            font-weight: 800;

            /*
               No text-shadow.
               Registration text stays crisp.
            */
            text-shadow: none;

            transition:
                color 0.2s ease;
        }

        .register-link a:hover {
            color: #fb923c;
        }

        /* =========================================================
           MODALS
           ========================================================= */

        #lightboxModal,
        #registerModal,
        #forgotModal {
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        #registerModal > div,
        #forgotModal > div {
            width:
                min(92vw, 390px) !important;

            border:
                1px solid #e2e8f0;

            border-radius:
                18px !important;

            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.25) !important;
        }

        #registerModal input,
        #forgotModal input {
            color: #172033 !important;
            background-color: #ffffff;
            -webkit-text-fill-color: #172033;
            min-height: 44px;

            border-radius:
                9px !important;
        }

        #registerModal input::placeholder,
        #forgotModal input::placeholder { color: #64748b; }

        #registerModal button,
        #forgotModal button {
            border-radius:
                9px !important;
        }

        /* =========================================================
           RESPONSIVE — TABLET
           ========================================================= */

        @media (max-width: 1050px) {

            .nav-links li a {
                padding-left: 10px;
                padding-right: 10px;

                font-size: 11px;
            }

            .top-navbar {
                padding-left: 16px;
                padding-right: 16px;
            }

            .right-section {
                min-width: 350px;

                padding: 28px;
            }

            .login-card {
                padding: 26px;
            }
        }

        /* =========================================================
           RESPONSIVE — MOBILE
           ========================================================= */

        @media (max-width: 820px) {

            body {
                overflow: auto;
            }

            .main-container {
                height: auto;

                min-height: 100vh;

                flex-direction: column;

                overflow: visible;
            }

            .left-section,
            .right-section {
                flex: none;

                width: 100%;
            }

            .left-section {
                min-height: 540px;

                overflow: visible;
            }

            .right-section {
                min-width: 0;

                min-height: 520px;

                padding:
                    28px 18px 42px;

                border-left: 0;

                border-top:
                    1px solid var(--soft-border);
            }

            .nav-links {
                min-height: auto;

                padding: 10px 0;

                justify-content: center;

                flex-wrap: wrap;
            }

            .banner-content {
                padding:
                    32px 18px;
            }

            .brand-box {
                padding:
                    36px 24px;
            }
        }

        /* =========================================================
           RESPONSIVE — SMALL MOBILE
           ========================================================= */

        @media (max-width: 480px) {

            .nav-links {
                display: grid;

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 3px;
            }

            .nav-links li a {
                width: 100%;

                padding:
                    0 4px;

                font-size: 10px;
            }

            .nav-links li a::after {
                left: 8px;
                right: 8px;
            }

            .brand-box .transport-title {
                font-size: 36px;
            }

            .brand-box .tagline {
                font-size: 12px;
            }

            .login-card {
                padding: 22px;

                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         MAIN CONTAINER
         ========================================================= -->

    <div class="main-container">

        <!-- =====================================================
             LEFT SECTION
             ===================================================== -->

        <div class="left-section">

            <!-- Navigation -->
            <nav class="top-navbar" aria-label="Main Navigation">

                <ul class="nav-links">

                    <li>
                        <a
                            href="#"
                            class="active"
                            onclick="showTab('home', event)"
                        >
                            Home
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            onclick="showTab('about', event)"
                        >
                            About Us
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            onclick="showTab('services', event)"
                        >
                            Services
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            onclick="showTab('gallery', event)"
                        >
                            Photo Gallery
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            onclick="showTab('career', event)"
                        >
                            Career
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            onclick="showTab('contact', event)"
                        >
                            Contact Us
                        </a>
                    </li>

                </ul>

            </nav>


            <!-- Dynamic Content -->
            <div
                class="banner-content"
                id="content-display"
            >

                <div class="brand-box">

                    <h1 class="transport-title">
                        Ekta Transport Company
                    </h1>

                    <p class="tagline">
                        Delivering Trust, On Time. Moving India Forward.
                    </p>

                </div>

            </div>

        </div>


        <!-- =====================================================
             RIGHT SECTION — LOGIN PORTAL
             ===================================================== -->

        <div class="right-section">

            <div class="login-card">

                <div class="login-tabs">

                    <button
                        class="tab-btn active"
                        id="ownerTabBtn"
                        onclick="switchLogin('owner')"
                    >
                        Owner
                    </button>

                    <button
                        class="tab-btn"
                        id="staffTabBtn"
                        onclick="switchLogin('staff')"
                    >
                        Staff
                    </button>

                </div>


                <h2
                    class="login-title"
                    id="loginPortalTitle"
                >
                    Owner Login Portal
                </h2>


                <form
                    id="loginForm"
                    onsubmit="handleLogin(event)"
                >

                    <div class="input-group">

                        <label id="userIdLabel">
                            Owner Mobile Number
                        </label>

                        <input
                            type="text"
                            id="userId"
                            placeholder="Enter 10-digit mobile" inputmode="numeric" maxlength="10"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >

                    </div>


                    <div class="forgot-pass">

                        <a
                            href="#"
                            onclick="openForgotModal(event)"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Secure Login
                    </button>

                </form>


                <div
                    class="register-link"
                    id="registerLinkSection"
                >
                    Don't have an account?

                    <a
                        href="#"
                        onclick="openRegisterModal(event)"
                    >
                        Register Now
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         LIGHTBOX MODAL
         ========================================================= -->

    <div
        id="lightboxModal"
        style="
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            z-index:2000;
            justify-content:center;
            align-items:center;
            flex-direction:column;
        "
    >

        <span
            onclick="closeLightbox()"
            style="
                position:absolute;
                top:20px;
                right:30px;
                font-size:35px;
                color:white;
                cursor:pointer;
                font-weight:bold;
            "
        >
            &times;
        </span>

        <img
            id="lightboxImg"
            src=""
            style="
                max-width:85%;
                max-height:80vh;
                border-radius:8px;
                box-shadow:0 5px 25px rgba(0,0,0,0.5);
            "
        >

        <p
            id="lightboxCaption"
            style="
                color:#cbd5e1;
                margin-top:15px;
                font-size:16px;
                font-weight:500;
            "
        ></p>

    </div>


    <!-- =========================================================
         REGISTER MODAL
         ========================================================= -->

    <div
        id="registerModal"
        style="
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
            z-index:1000;
            justify-content:center;
            align-items:center;
        "
    >

        <div
            style="
                background:#fff;
                padding:25px;
                border-radius:8px;
                width:340px;
                box-shadow:0 4px 15px rgba(0,0,0,0.3);
                text-align:left;
                position:relative;
            "
        >

            <h3
                style="
                    margin-top:0;
                    margin-bottom:20px;
                    color:#ff6600;
                "
            >
                Owner Registration
            </h3>


            <div id="stepMobile">

                <div style="margin-bottom:12px;">

                    <label
                        style="
                            font-size:13px;
                            color:#555;
                            display:block;
                            margin-bottom:5px;
                        "
                    >
                        Owner Name
                    </label>

                    <input
                        type="text"
                        id="regOwnerName"
                        placeholder="Enter full name"
                        style="
                            width:100%;
                            padding:9px;
                            box-sizing:border-box;
                            border:1px solid #ccc;
                            border-radius:4px;
                        "
                    >

                </div>


                <div style="margin-bottom:12px;">

                    <label
                        style="
                            font-size:13px;
                            color:#555;
                            display:block;
                            margin-bottom:5px;
                        "
                    >
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="regMobile"
                        placeholder="Enter 10-digit mobile number"
                        style="
                            width:100%;
                            padding:9px;
                            box-sizing:border-box;
                            border:1px solid #ccc;
                            border-radius:4px;
                        "
                    >

                </div>


                <button
                    type="button"
                    onclick="sendOtpToOwner()"
                    style="
                        width:100%;
                        padding:10px;
                        background:#ff6600;
                        color:white;
                        border:none;
                        border-radius:4px;
                        cursor:pointer;
                        font-weight:bold;
                    "
                >
                    Send OTP
                </button>

            </div>


            <div
                id="stepOtp"
                style="display:none;"
            >

                <label
                    style="
                        font-size:13px;
                        color:#555;
                        display:block;
                        margin-bottom:5px;
                    "
                >
                    Enter 6-Digit OTP
                </label>

                <input
                    type="text"
                    id="enteredOtp" inputmode="numeric" maxlength="6"
                    placeholder="Enter OTP received on SMS"
                    style="
                        width:100%;
                        padding:9px;
                        margin-bottom:12px;
                        box-sizing:border-box;
                        border:1px solid #ccc;
                        border-radius:4px;
                    "
                >

                <button
                    type="button"
                    onclick="verifyOtp()"
                    style="
                        width:100%;
                        padding:10px;
                        background:#ff6600;
                        color:white;
                        border:none;
                        border-radius:4px;
                        cursor:pointer;
                        font-weight:bold;
                    "
                >
                    Verify OTP
                </button>

            </div>


            <div
                id="stepPassword"
                style="display:none;"
            >

                <label
                    style="
                        font-size:13px;
                        color:#555;
                        display:block;
                        margin-bottom:5px;
                    "
                >
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    style="
                        width:100%;
                        padding:9px;
                        margin-bottom:10px;
                        box-sizing:border-box;
                        border:1px solid #ccc;

        /* =========================================================
           EKTA OWNER AUTH - REAL SUPABASE SESSION
           ========================================================= */
        let savedMobile = '';
        let ownerSession = null;
        let ownerFlow = 'register';
        const EKTA_AUTH_URL = 'https://hsrtysxybppsochlekjm.supabase.co/functions/v1/ekta-owner-auth';
        const normalizeMobile = value => String(value || '').replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
        const ownerEmail = mobile => `owner-${mobile}@auth.ektatransport.com`;

        function ektaClient() {
            const client = window.supabaseClient;
            if (!client || !client.auth) throw new Error('Supabase client not loaded. Check db.js.');
            return client;
        }

        function validMobile(mobile) {
            return /^[6-9]\d{9}$/.test(mobile);
        }

        async function authRequest(action, phone, extra = {}, token = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const response = await fetch(EKTA_AUTH_URL, {
                method: 'POST', headers,
                body: JSON.stringify({ action, phone, ...extra })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) throw new Error(data.error || 'Authentication request failed');
            return data;
        }

        async function exchangeVerifiedOtp(data) {
            const { data: verified, error } = await ektaClient().auth.verifyOtp({
                token_hash: data.token_hash,
                type: 'magiclink'
            });
            if (error || !verified?.session) throw new Error(error?.message || 'Could not start secure session');
            ownerSession = verified.session;
            return verified.session;
        }

        async function sendOtpToOwner() {
            const mobile = normalizeMobile(document.getElementById('regMobile').value);
            if (!validMobile(mobile)) return alert('Enter a valid 10-digit Owner mobile number.');
            try {
                await authRequest('send_otp', mobile);
                savedMobile = mobile;
                ownerFlow = 'register';
                document.getElementById('stepMobile').style.display = 'none';
                document.getElementById('stepOtp').style.display = 'block';
                alert('OTP sent to your registered Owner mobile. Valid for 5 minutes.');
            } catch (e) { alert(e.message); }
        }

        async function verifyOtp() {
            const otp = document.getElementById('enteredOtp').value.trim();
            if (!/^\d{6}$/.test(otp)) return alert('Enter the 6-digit SMS OTP.');
            try {
                const response = await authRequest('verify_otp', savedMobile, { otp });
                await exchangeVerifiedOtp(response);
                document.getElementById('stepOtp').style.display = 'none';
                document.getElementById('stepPassword').style.display = 'block';
                alert('Mobile verified. Set your Owner password.');
            } catch (e) { alert(e.message); }
        }

        async function saveOwnerPassword() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password.length < 12 || password !== confirm)
                return alert('Password must be at least 12 characters and both passwords must match.');
            try {
                const { data: sessionData } = await ektaClient().auth.getSession();
                const token = sessionData?.session?.access_token;
                if (!token) throw new Error('Verify your mobile OTP again.');
                await authRequest('set_password', savedMobile, { password }, token);
                document.getElementById('password').value = '';
                document.getElementById('userId').value = savedMobile;
                closeRegisterModal();
                alert('Owner password saved. You can now log in using mobile number and password.');
                await ektaClient().auth.signOut();
            } catch (e) { alert(e.message); }
        }

        async function sendForgotOtp() {
            const mobile = normalizeMobile(document.getElementById('forgotMobile').value);
            if (!validMobile(mobile)) return alert('Enter a valid 10-digit mobile.');
            try {
                await authRequest('send_otp', mobile);
                savedMobile = mobile;
                document.getElementById('forgotStep1').style.display = 'none';
                document.getElementById('forgotStep2').style.display = 'block';
                alert('Password reset OTP sent. Valid for 5 minutes.');
            } catch (e) { alert(e.message); }
        }

        async function resetPasswordFinal() {
            const otp = document.getElementById('forgotOtpInput').value.trim();
            const password = document.getElementById('newForgotPass').value;
            if (!/^\d{6}$/.test(otp)) return alert('Enter your 6-digit SMS OTP.');
            if (password.length < 12) return alert('New password must have at least 12 characters.');
            try {
                const response = await authRequest('verify_otp', savedMobile, { otp });
                const session = await exchangeVerifiedOtp(response);
                await authRequest('set_password', savedMobile, { password }, session.access_token);
                await ektaClient().auth.signOut();
                closeForgotModal();
                alert('Password changed. Log in using your new password.');
            } catch (e) { alert(e.message); }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const role = document.getElementById('ownerTabBtn').classList.contains('active') ? 'owner' : 'staff';
            if (role !== 'owner') return alert('Staff login will be enabled separately.');
            const mobile = normalizeMobile(document.getElementById('userId').value);
            const password = document.getElementById('password').value;
            if (!validMobile(mobile) || !password) return alert('Enter mobile number and password.');
            try {
                const client = ektaClient();
                const { data, error } = await client.auth.signInWithPassword({
                    email: ownerEmail(mobile), password
                });
                if (error || !data?.user) throw new Error('Invalid mobile number or password.');
                if (data.user.user_metadata?.ekta_role !== 'owner' ||
                    data.user.user_metadata?.owner_phone !== mobile) {
                    await client.auth.signOut();
                    throw new Error('Owner authorization failed.');
                }
                window.location.href = 'owner-dashboard.html';
            } catch (e) { alert(e.message); }
        }
